<div class="m-4 text-center d-flex justify-content-center">
  <div class="card col-8 bg-light border border-secondary w-40">
    <div class="card-header">
      <h2>Consulta de Contacto</h2>
    </div>

    <div class="card-body">
      <div class="row mb-3">
        <div class="col-12 text-start">
          <strong>Nombre:</strong>
          <p>{{ consulta.nombre }}</p>
        </div>
        <div class="col-12 text-start">
          <strong>Email:</strong>
          <p>{{ consulta.email }}</p>
        </div>
        <div class="col-12 text-start">
          <strong>Teléfono:</strong>
          <p>{{ consulta.telefono }}</p>
        </div>
      </div>
      <div class="row mb-3">
      <div class="col-12 text-start">
        <strong>Fecha de Envío:</strong>
        <p>{{ consulta.fecha_envio | date: 'dd/MM/yy' }}</p>
      </div>
    </div>
      <div class="row mb-3">
        <div class="col-12 text-start">
          <strong>Consulta:</strong>
          <p>{{ consulta.consulta }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
