<div class="tabla-container">
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Fecha de Envío</th>
      <th>Detalle</th>
      <th>Eliminar</th>
    </tr>
    </thead>
    <tbody>
      @for(consulta of consultas; track consulta.id){
        <tr>
          <td>{{ consulta.id }}</td>
          <td>{{ consulta.nombre }}</td>
          <td>{{ consulta.email }}</td>
          <td>{{ consulta.fecha_envio | date:'dd/MM/yy' }}</td>
          <td>
            <fa-icon class="btn" routerLink="consultasDetail/{{consulta.id}}" [icon]="faCircleInfo"></fa-icon>
          </td>
          <td>
            <div class="btn" (click)="deleteConsulta(consulta.id)">
              <svg width="25px" height="25px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/>
              </svg>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
